<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mailing Lists</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f4;
  --surface: #fff;
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --line: #e4e4e4;
  --danger: #b91c1c;
  --ok: #166534;
  --warn: #9a6700;
  --soft: #f7f7f7;
  font-family: "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #121212;
    --surface: #1e1e1e;
    --text: #f5f5f5;
    --muted: #c8c8c8;
    --line: #3a3a3a;
    --danger: #ff8a80;
    --ok: #86efac;
    --warn: #f5d67b;
    --soft: #2a2a2a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.top { padding: 16px 16px 0; }
h1 { margin: 0; font-size: 22px; }
.lede { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.nav { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; }
.nav button, .tab button, .ghost, .danger {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 8px 12px;
  white-space: nowrap;
}
.nav button[aria-current="page"], .tab button[aria-current="page"], .primary {
  background: #111;
  color: #fff;
  border-color: #111;
}
@media (prefers-color-scheme: dark) {
  .nav button[aria-current="page"], .tab button[aria-current="page"], .primary { background: #f5f5f5; color: #111; border-color: #f5f5f5; }
}
.main { padding: 0 16px 28px; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.stat { background: var(--soft); border-radius: 12px; padding: 12px; }
.stat b { display: block; font-size: 22px; }
.stat span, .muted { color: var(--muted); }
.row { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.split { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input, select, textarea {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  padding: 8px 10px;
  width: 100%;
}
textarea { min-height: 72px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.banner { border-radius: 12px; padding: 10px 12px; background: var(--soft); }
.banner.warn { color: var(--warn); }
.banner.bad { color: var(--danger); }
.banner.good { color: var(--ok); }
.tab { display: flex; gap: 8px; overflow-x: auto; }
.sheet { position: relative; width: min(100%, 420px); background: #fff; color: #111; border: 1px solid var(--line); }
.slot { position: absolute; border: 1px dashed #bbb; overflow: hidden; padding: 2px; font-size: 8px; line-height: 1.2; }
.people { display: flex; flex-direction: column; }
.people button { text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 10px 0; border-radius: 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 8px; background: var(--soft); font-size: 12px; }
@media (max-width: 720px) {
  table, thead, tbody, tr, th, td { display: block; }
  thead { display: none; }
  td { border-top: 0; padding: 2px 0; }
  tr { border-top: 1px solid var(--line); padding: 8px 0; }
}

</style>
</head>
<body>
<div id="app"><p>Loading mailing lists…</p></div>
<script>
window.Mailing = (function () {
const FAMILY = new Set(['spouse', 'partner', 'boyfriend/girlfriend', 'husband', 'wife'])
const PARENT = new Set(['parent', 'child', 'guardian'])
const SIBLING = new Set(['sibling'])
const BUSINESS = /\b(work|business|office|company|corporate)\b/i

const STREET = {
  st: 'street',
  str: 'street',
  ave: 'avenue',
  av: 'avenue',
  rd: 'road',
  dr: 'drive',
  ln: 'lane',
  blvd: 'boulevard',
  ct: 'court',
  cir: 'circle',
  pl: 'place',
  ter: 'terrace',
  hwy: 'highway',
  pkwy: 'parkway',
  apt: 'apartment',
  ste: 'suite',
  fl: 'floor',
  n: 'north',
  s: 'south',
  e: 'east',
  w: 'west',
}

const COUNTRY = {
  us: 'us',
  usa: 'us',
  'united states': 'us',
  'united states of america': 'us',
  uk: 'gb',
  'united kingdom': 'gb',
  'great britain': 'gb',
}

const CAMPAIGN_TYPES = [
  ['holiday', 'Holiday'],
  ['announcement', 'Announcement'],
  ['invitation', 'Invitation'],
  ['thank-you', 'Thank you'],
  ['newsletter', 'Newsletter'],
  ['general', 'General'],
]

const SALUTATION_STYLES = [
  ['preferred', 'Preferred salutation'],
  ['names', 'Individual names'],
  ['family', 'The family'],
  ['household', 'The household'],
  ['formal', 'Full names'],
]

const DELIVERY_STATUSES = {
  physical: ['pending', 'approved', 'exported', 'sent', 'delivered', 'returned', 'failed', 'cancelled'],
  email: ['pending', 'approved', 'exported', 'queued', 'sent', 'delivered', 'bounced', 'failed', 'cancelled', 'received'],
}

function createId() {
  const bytes = new Uint8Array(16)
  if (globalThis.crypto?.getRandomValues) globalThis.crypto.getRandomValues(bytes)
  else for (let i = 0; i < bytes.length; i += 1) bytes[i] = Math.floor(Math.random() * 256)
  bytes[6] = (bytes[6] & 15) | 64
  bytes[8] = (bytes[8] & 63) | 128
  const hex = [...bytes].map((byte) => byte.toString(16).padStart(2, '0')).join('')
  return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`
}

function asId(value) {
  const text = String(value || '').trim().toLowerCase()
  if (/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(text) && text.length <= 40) return text
  return hashId('id', [text])
}

function nowIso() {
  return new Date().toISOString()
}

function clone(value) {
  return value == null ? value : JSON.parse(JSON.stringify(value))
}

function auditEntry({ action, actor, targetType, targetId, detail, at }) {
  return {
    action,
    actor: actor || 'Someone',
    targetType,
    targetId: targetId || '',
    detail: detail || '',
    at: at || nowIso(),
  }
}

function memberIdentity(stored, displayName) {
  const name = String(displayName || '').trim() || 'Someone'
  let parsed = null
  if (typeof stored === 'string' && stored.trim()) {
    try { parsed = JSON.parse(stored) } catch { parsed = null }
  }
  const rawId = parsed && typeof parsed.id === 'string' ? parsed.id : ''
  const id = /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(rawId) && rawId.length <= 40 ? rawId : createId()
  const changed = !parsed || parsed.id !== id || parsed.name !== name
  return { id, name, token: JSON.stringify({ id, name }), changed }
}

function withAccess(record, member, sharing) {
  const next = { ...record }
  const person = member?.id ? member : { id: 'member', name: 'Someone' }
  if (!next.ownerId) {
    next.ownerId = person.id
    next.ownerName = person.name
  }
  next.sharing = sharing === 'private' ? 'private' : 'workspace'
  const editors = Array.isArray(next.editors) ? next.editors.filter((row) => row && row.id && row.id !== person.id) : []
  editors.unshift({ id: person.id, name: person.name || 'Someone' })
  next.editors = editors.slice(0, 8)
  next.updatedBy = person.name
  return next
}

function canSeeShared(record, memberId) {
  if (!record) return false
  if (record.sharing !== 'private') return true
  return Boolean(memberId) && record.ownerId === memberId
}

function campaignSharing(campaign, lists) {
  const byId = new Map((lists || []).map((list) => [list.id, list]))
  const privateSource = (campaign?.sourceListIds || []).some((id) => byId.get(id)?.sharing === 'private')
  if (privateSource) return 'private'
  return campaign?.sharing === 'private' ? 'private' : 'workspace'
}

function canSeeCampaign(campaign, lists, memberId) {
  if (!campaign || !canSeeShared(campaign, memberId)) return false
  const byId = new Map((lists || []).map((list) => [list.id, list]))
  return (campaign.sourceListIds || []).every((id) => {
    const list = byId.get(id)
    return !list || canSeeShared(list, memberId)
  })
}

function editorNames(record) {
  const names = []
  for (const editor of record?.editors || []) {
    if (editor?.name && !names.includes(editor.name)) names.push(editor.name)
  }
  if (record?.ownerName && !names.includes(record.ownerName)) names.push(record.ownerName)
  return names
}

function hashId(prefix, parts) {
  let h1 = 2166136261
  let h2 = 2166136261 ^ 0x9e3779b9
  const text = parts.join('|')
  for (let i = 0; i < text.length; i += 1) {
    h1 ^= text.charCodeAt(i)
    h1 = Math.imul(h1, 16777619)
    h2 ^= text.charCodeAt(text.length - 1 - i)
    h2 = Math.imul(h2, 16777619)
  }
  const hex = (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0')
  return `${prefix}-${hex}`
}

function normToken(value) {
  return String(value || '')
    .toLowerCase()
    .replace(/&/g, ' and ')
    .replace(/[#.,]/g, ' ')
    .replace(/[^a-z0-9\s]/g, ' ')
    .split(/\s+/)
    .filter(Boolean)
    .map((word) => STREET[word] || word)
    .join(' ')
}

function normPostal(value) {
  return String(value || '').toLowerCase().replace(/[^a-z0-9]/g, '')
}

function normCountry(value) {
  const text = normToken(value)
  return COUNTRY[text] || text
}

function residentialAddresses(contact) {
  const rows = Array.isArray(contact?.addresses) ? contact.addresses : []
  const home = rows.filter((row) => !BUSINESS.test(row?.label || ''))
  return home.length ? home : []
}

function addressKey(address) {
  if (!address) return ''
  const line1 = normToken(address.line1 || address.street)
  const line2 = normToken(address.line2 || address.street2)
  const city = normToken(address.city)
  const region = normToken(address.region)
  const postal = normPostal(address.postalCode)
  const country = normCountry(address.country)
  if (!line1 && !city && !postal) return ''
  return [line1, line2, city, region, postal, country].join('|')
}

function matchAddresses(leftContact, rightContact) {
  const left = residentialAddresses(leftContact).map(addressKey).filter(Boolean)
  const right = residentialAddresses(rightContact).map(addressKey).filter(Boolean)
  if (!left.length || !right.length) return 'none'
  if (left.some((key) => right.includes(key))) return 'exact'
  const strip = (key) => key.split('|').map((part, index) => (index === 1 ? '' : part)).join('|')
  for (const a of left) {
    for (const b of right) {
      if (strip(a) === strip(b) && a !== b) return 'unit-conflict'
    }
  }
  return 'none'
}

function surname(contact) {
  return normToken(contact?.lastName || familyName(contact?.displayName))
}

function familyName(displayName) {
  const parts = String(displayName || '').trim().split(/\s+/)
  return parts.length > 1 ? parts[parts.length - 1] : ''
}

function relations(contact) {
  const rows = Array.isArray(contact?.relationships) ? contact.relationships : []
  return rows.map((row) => ({ id: String(row.contactId || ''), type: String(row.type || '').toLowerCase() }))
}

function householdConfidence(left, right) {
  const reasons = []
  let score = 0
  const address = matchAddresses(left, right)
  if (address === 'exact') {
    score += 60
    reasons.push('Same residential address')
  }
  const leftSurname = surname(left)
  const rightSurname = surname(right)
  if (leftSurname && leftSurname === rightSurname) {
    score += 15
    reasons.push('Same surname')
  }
  const linked = new Set([
    ...relations(left).filter((row) => row.id === right.id).map((row) => row.type),
    ...relations(right).filter((row) => row.id === left.id).map((row) => row.type),
  ])
  if ([...linked].some((type) => FAMILY.has(type))) {
    score += 55
    reasons.push('Partner or spouse')
  } else if ([...linked].some((type) => PARENT.has(type))) {
    score += 25
    reasons.push('Parent or child')
  } else if ([...linked].some((type) => SIBLING.has(type))) {
    score += 15
    reasons.push('Sibling')
  }
  if (address === 'unit-conflict') reasons.push('Apartment or unit does not match')
  return {
    score: Math.min(100, score),
    reasons,
    conflict: address === 'unit-conflict',
    level: score >= 95 ? 'auto' : score >= 75 ? 'review' : score >= 50 ? 'suggestion' : 'ignore',
  }
}

function currentMembers(household, at = nowIso()) {
  return (household?.members || []).filter((member) => !member.validUntil || member.validUntil > at)
}

function pairKey(left, right) {
  return [left, right].sort().join('|')
}

function planHouseholds(contacts, households, suggestions, autoEnabled, blockedPairs = []) {
  const people = contacts.filter((contact) => contact?.id)
  const byId = new Map(people.map((contact) => [contact.id, contact]))
  const blocked = new Set(blockedPairs || [])
  const closed = new Set((suggestions || []).filter((row) => row.status === 'dismissed' || row.status === 'accepted').map((row) => row.id))
  const homeOf = new Map()
  for (const household of households || []) {
    if (household.archived) continue
    for (const member of currentMembers(household)) homeOf.set(member.contactId, household.id)
  }
  const pairs = []
  for (let i = 0; i < people.length; i += 1) {
    for (let j = i + 1; j < people.length; j += 1) {
      if (blocked.has(pairKey(people[i].id, people[j].id))) continue
      const confidence = householdConfidence(people[i], people[j])
      if (confidence.level === 'ignore') continue
      const homeA = homeOf.get(people[i].id) || ''
      const homeB = homeOf.get(people[j].id) || ''
      if (homeA && homeA === homeB) continue
      pairs.push({ a: people[i].id, b: people[j].id, ...confidence, homeA, homeB })
    }
  }
  const parent = new Map()
  const find = (id) => {
    const current = parent.get(id) || id
    if (current === id) return id
    const root = find(current)
    parent.set(id, root)
    return root
  }
  const unite = (left, right) => {
    const a = find(left)
    const b = find(right)
    if (a !== b) parent.set(a, b)
  }
  for (const pair of pairs) {
    if (autoEnabled && pair.score >= 95 && !pair.homeA && !pair.homeB) unite(pair.a, pair.b)
  }
  const groups = new Map()
  for (const pair of pairs) {
    if (!(autoEnabled && pair.score >= 95 && !pair.homeA && !pair.homeB)) continue
    const root = find(pair.a)
    const group = groups.get(root) || { ids: new Set(), reasons: new Set(), score: 0 }
    group.ids.add(pair.a)
    group.ids.add(pair.b)
    pair.reasons.forEach((reason) => group.reasons.add(reason))
    group.score = Math.max(group.score, pair.score)
    groups.set(root, group)
  }
  const grouped = new Set()
  const create = []
  for (const group of groups.values()) {
    const ids = [...group.ids]
    if (ids.length < 2) continue
    ids.forEach((id) => grouped.add(id))
    const members = ids.map((id) => byId.get(id)).filter(Boolean)
    const shared = sharedAddress(members)
    const name = householdTitle(members)
    create.push({
      id: createId(),
      name,
      salutation: name,
      notes: '',
      primaryAddressId: shared?.id || '',
      addresses: shared ? [shared] : [],
      members: ids.map((id, index) => ({
        contactId: id,
        relationshipType: index === 0 ? 'primary' : 'member',
        displayOrder: index,
        primary: index === 0,
        validFrom: nowIso(),
        validUntil: '',
      })),
      match: { confidence: group.score, reasons: [...group.reasons], at: nowIso() },
      archived: false,
    })
  }
  const suggest = []
  const seen = new Set()
  for (const pair of pairs) {
    if (grouped.has(pair.a) && grouped.has(pair.b)) continue
    let kind = 'create'
    let householdId = ''
    let contactIds = [pair.a, pair.b]
    const newHomeA = grouped.has(pair.a)
    const newHomeB = grouped.has(pair.b)
    if ((pair.homeA || newHomeA) && !pair.homeB && !newHomeB) {
      kind = 'add'
      householdId = pair.homeA || create.find((row) => row.members.some((member) => member.contactId === pair.a))?.id || ''
      contactIds = [pair.b]
    } else if ((pair.homeB || newHomeB) && !pair.homeA && !newHomeA) {
      kind = 'add'
      householdId = pair.homeB || create.find((row) => row.members.some((member) => member.contactId === pair.b))?.id || ''
      contactIds = [pair.a]
    } else if (pair.homeA && pair.homeB && pair.homeA !== pair.homeB && pair.score >= 75) {
      kind = 'merge'
      contactIds = [pair.a, pair.b]
      householdId = pair.homeA
    } else if (pair.homeA || pair.homeB || newHomeA || newHomeB) {
      continue
    }
    const id = hashId('s', [kind, householdId, ...contactIds].sort())
    if (closed.has(id) || seen.has(id)) continue
    seen.add(id)
    suggest.push({
      id,
      kind,
      contactIds,
      householdId,
      otherHouseholdId: kind === 'merge' ? pair.homeB : '',
      confidence: pair.score,
      reasons: pair.reasons,
      level: pair.score >= 75 ? 'review' : 'suggestion',
      status: 'pending',
    })
  }
  return { create, suggest }
}

function sharedAddress(contacts) {
  const counts = new Map()
  for (const contact of contacts) {
    for (const address of residentialAddresses(contact)) {
      const key = addressKey(address)
      if (!key) continue
      const current = counts.get(key) || { count: 0, address }
      current.count += 1
      counts.set(key, current)
    }
  }
  let best = null
  for (const row of counts.values()) if (!best || row.count > best.count) best = row
  if (!best) return null
  return normalizeStoredAddress(best.address, { sourceContactId: '', type: 'residential' })
}

function householdTitle(contacts) {
  const names = contacts.map((contact) => personName(contact))
  const tally = new Map()
  for (const name of names) {
    if (!name.last) continue
    tally.set(name.last, (tally.get(name.last) || 0) + 1)
  }
  let last = ''
  let count = 0
  for (const [value, seen] of tally) {
    if (seen > count) {
      last = value
      count = seen
    }
  }
  if (last && count >= 2) return `The ${last} Household`
  if (names.length === 2) return `${names[0].full} and ${names[1].full}`
  return names[0]?.full ? `${names[0].full}'s household` : 'New household'
}

function personName(contact) {
  const preferred = String(contact?.preferredName || '').trim()
  const first = String(contact?.firstName || '').trim()
  const last = String(contact?.lastName || '').trim() || familyName(contact?.displayName)
  const given = preferred || first
  const full = String(contact?.displayName || '').trim() || [given, last].filter(Boolean).join(' ') || 'Unnamed'
  return { first: given || full, last, full }
}

function formatSalutation(style, contacts, household) {
  const people = (contacts || []).map(personName)
  const members = people.map((person) => person.full)
  const preferred = String(household?.salutation || '').trim()
  if (!people.length) return { salutation: preferred || household?.name || 'Unnamed', members }
  if (style === 'preferred' && preferred) return { salutation: preferred, members }
  if (style === 'household') return { salutation: preferred || householdTitle(contacts), members }
  if (style === 'family') {
    const tally = new Map()
    for (const person of people) if (person.last) tally.set(person.last, (tally.get(person.last) || 0) + 1)
    let last = ''
    let count = 0
    for (const [value, seen] of tally) if (seen > count) { last = value; count = seen }
    return { salutation: last ? `The ${last} Family` : (preferred || household?.name || 'The Family'), members }
  }
  if (style === 'formal' || people.length === 1) {
    if (people.length === 1) return { salutation: people[0].full, members }
    return { salutation: joinNames(people.map((person) => person.full)), members }
  }
  const sameLast = people.every((person) => person.last && person.last === people[0].last)
  if (sameLast && people.length === 2) return { salutation: `${people[0].first} & ${people[1].first} ${people[0].last}`, members }
  if (sameLast) {
    const given = people.map((person) => person.first)
    return { salutation: `${joinNames(given)} ${people[0].last}`, members }
  }
  return { salutation: joinNames(people.map((person) => person.full)), members }
}

function joinNames(names) {
  if (names.length <= 1) return names[0] || ''
  if (names.length === 2) return `${names[0]} and ${names[1]}`
  return `${names.slice(0, -1).join(', ')}, and ${names[names.length - 1]}`
}

function normalizeStoredAddress(address, extra = {}) {
  const line1 = String(address?.line1 || address?.street || '').trim()
  const line2 = String(address?.line2 || address?.street2 || '').trim()
  const city = String(address?.city || '').trim()
  const region = String(address?.region || '').trim()
  const postalCode = String(address?.postalCode || '').trim()
  const country = String(address?.country || '').trim()
  const stored = {
    id: address?.id && asId(address.id) === String(address.id).toLowerCase() ? String(address.id).toLowerCase() : createId(),
    line1,
    line2,
    city,
    region,
    postalCode,
    country,
    type: extra.type || address?.type || 'residential',
    validationStatus: address?.validationStatus || 'unverified',
    lastVerifiedAt: address?.lastVerifiedAt || '',
    sourceContactId: extra.sourceContactId || address?.sourceContactId || '',
    sourceAddressId: address?.sourceAddressId || address?.id || '',
    current: true,
    replacedAt: '',
    createdAt: address?.createdAt || nowIso(),
  }
  stored.formatted = formatAddress(stored).join(', ')
  return stored
}

function replaceAddress(household, addressId, next) {
  const copy = clone(household)
  const at = nowIso()
  copy.addresses = (copy.addresses || []).map((address) => {
    if (address.id !== addressId) return address
    return { ...address, current: false, replacedAt: at }
  })
  const stored = normalizeStoredAddress({ ...next, validationStatus: 'unverified', lastVerifiedAt: '' })
  copy.addresses.push(stored)
  if (!copy.primaryAddressId || copy.primaryAddressId === addressId) copy.primaryAddressId = stored.id
  copy.updatedAt = at
  return copy
}

function currentAddresses(household) {
  return (household?.addresses || []).filter((address) => address.current !== false && !address.replacedAt)
}

function primaryAddress(household) {
  const current = currentAddresses(household)
  return current.find((address) => address.id === household?.primaryAddressId) || current[0] || null
}

function formatAddress(address) {
  return addressLines(address)
}

function addressLines(address) {
  if (!address) return []
  const lines = []
  if (address.line1) lines.push(address.line1)
  if (address.line2) lines.push(address.line2)
  const region = [address.region, address.postalCode].filter(Boolean).join(' ')
  const city = [address.city, region].filter(Boolean).join(', ')
  if (city) lines.push(city)
  const country = String(address.country || '').trim()
  if (country && !/^(us|usa|united states|united states of america)$/i.test(country)) lines.push(country)
  return lines
}

function emptyRules() {
  return { version: 1, match: 'all', conditions: [], exclusions: [] }
}

const RULE_FIELDS = new Set(['tag', 'country', 'region', 'city', 'has-address', 'has-email', 'created', 'in-household', 'last-correspondence', 'campaign'])

function validateRules(rules) {
  if (!rules || typeof rules !== 'object') return 'Add a rule'
  if (rules.version !== 1) return 'These rules use an unsupported version'
  if (rules.match !== 'all' && rules.match !== 'any') return 'Choose whether all conditions or any condition must match'
  if (!Array.isArray(rules.conditions)) return 'Rules need a condition list'
  for (const condition of rules.conditions) {
    if (!condition || !RULE_FIELDS.has(condition.field)) return 'A condition uses an unknown field'
    if (!condition.op || !String(condition.value ?? '').trim()) return 'Finish each condition'
  }
  return ''
}

function primaryEmail(contact) {
  const emails = Array.isArray(contact?.emails) ? contact.emails : []
  const chosen = emails.find((row) => row.primary) || emails[0]
  return String(chosen?.value || '').trim()
}

function contactCountry(contact) {
  const address = residentialAddresses(contact)[0]
  return normCountry(address?.country)
}

function contactMatches(contact, condition, world) {
  const value = String(condition.value || '').trim().toLowerCase()
  if (condition.field === 'tag') {
    const tags = (contact.tags || []).map((tag) => String(tag.name || tag).toLowerCase())
    const has = tags.includes(value)
    return condition.op === 'is-not' ? !has : has
  }
  if (condition.field === 'country') {
    const has = contactCountry(contact) === normCountry(value)
    return condition.op === 'is-not' ? !has : has
  }
  if (condition.field === 'region' || condition.field === 'city') {
    const addresses = residentialAddresses(contact)
    const has = addresses.some((address) => normToken(address[condition.field]) === normToken(value))
    return condition.op === 'is-not' ? !has : has
  }
  if (condition.field === 'has-address') {
    const has = residentialAddresses(contact).some((address) => addressKey(address))
    return value === 'no' ? !has : has
  }
  if (condition.field === 'has-email') {
    const has = Boolean(primaryEmail(contact))
    return value === 'no' ? !has : has
  }
  if (condition.field === 'created') {
    const created = Date.parse(contact.createdAt || '')
    const target = Date.parse(condition.value)
    if (Number.isNaN(created) || Number.isNaN(target)) return false
    return condition.op === 'before' ? created < target : created >= target
  }
  if (condition.field === 'in-household') {
    const homes = homesOf(contact.id, world.households)
    if (value === 'any') return condition.op === 'is-not' ? homes.length === 0 : homes.length > 0
    const has = homes.some((home) => home.id === condition.value)
    return condition.op === 'is-not' ? !has : has
  }
  if (condition.field === 'last-correspondence') {
    const last = lastCorrespondence(contact.id, world)
    if (condition.op === 'never') return !last
    if (!last) return condition.op === 'before'
    const when = Date.parse(last)
    const target = Date.parse(condition.value)
    if (Number.isNaN(when) || Number.isNaN(target)) return false
    return condition.op === 'before' ? when < target : when >= target
  }
  if (condition.field === 'campaign') {
    const hits = campaignHits(contact.id, world)
    const has = hits.some((hit) => hit.id === condition.value || hit.campaignType === value || hit.name.toLowerCase() === value)
    return condition.op === 'not-participated' ? !has : has
  }
  return false
}

function homesOf(contactId, households) {
  return (households || []).filter((household) => !household.archived && currentMembers(household).some((member) => member.contactId === contactId))
}

function lastCorrespondence(contactId, world) {
  let latest = ''
  for (const recipient of world.recipients || []) {
    if (recipient.excluded) continue
    const campaign = (world.campaigns || []).find((row) => row.id === recipient.campaignId)
    if (!campaign || (campaign.status !== 'completed' && campaign.status !== 'active' && campaign.status !== 'ready')) continue
    const involved = recipient.recipientId === contactId || (recipient.memberIds || []).includes(contactId)
    if (!involved) continue
    const when = recipient.sentAt || recipient.exportedAt || recipient.includedAt || ''
    if (when > latest) latest = when
  }
  return latest
}

function campaignHits(contactId, world) {
  const hits = []
  for (const recipient of world.recipients || []) {
    if (recipient.excluded) continue
    const involved = recipient.recipientId === contactId || (recipient.memberIds || []).includes(contactId)
    if (!involved) continue
    const campaign = (world.campaigns || []).find((row) => row.id === recipient.campaignId)
    if (campaign) hits.push(campaign)
  }
  return hits
}

function evaluateDynamicList(list, world) {
  const rules = list.rules || emptyRules()
  const problem = validateRules(rules)
  if (problem) return { contacts: [], households: [], problem }
  if (!rules.conditions.length) return { contacts: [], households: [], problem: '' }
  const excluded = new Set((rules.exclusions || []).map((row) => `${row.type}:${row.id}`))
  const matched = []
  for (const contact of world.contacts || []) {
    if (excluded.has(`contact:${contact.id}`)) continue
    const results = rules.conditions.map((condition) => contactMatches(contact, condition, world))
    const ok = rules.match === 'any' ? results.some(Boolean) : results.every(Boolean)
    if (ok) matched.push(contact)
  }
  const mode = list.recipientMode || 'mixed'
  if (mode === 'individual') {
    return { contacts: matched, households: [], problem: '' }
  }
  const householdIds = new Set()
  const loose = []
  for (const contact of matched) {
    const homes = homesOf(contact.id, world.households).filter((home) => !excluded.has(`household:${home.id}`))
    if (!homes.length) loose.push(contact)
    homes.forEach((home) => householdIds.add(home.id))
  }
  const households = (world.households || []).filter((home) => householdIds.has(home.id))
  if (mode === 'household') return { contacts: loose, households, problem: '' }
  return { contacts: loose, households, problem: '' }
}

function listMembership(list, world) {
  if (list.archived) return { contacts: [], households: [] }
  if (list.listType === 'dynamic') return evaluateDynamicList(list, world)
  const contacts = []
  const households = []
  const byContact = new Map((world.contacts || []).map((contact) => [contact.id, contact]))
  const byHouse = new Map((world.households || []).map((home) => [home.id, home]))
  for (const member of list.members || []) {
    if (member.status === 'excluded') continue
    if (member.type === 'household') {
      const home = byHouse.get(member.id)
      if (home && !home.archived) households.push(home)
    } else {
      const contact = byContact.get(member.id)
      if (contact) contacts.push(contact)
    }
  }
  return { contacts, households, problem: '' }
}

function suppressionSet(rows) {
  return new Set((rows || []).map((row) => String(row.email || '').trim().toLowerCase()).filter(Boolean))
}

function prepareCampaign(campaign, world) {
  const contacts = new Map((world.contacts || []).map((contact) => [contact.id, contact]))
  const households = new Map((world.households || []).filter((home) => !home.archived).map((home) => [home.id, home]))
  const lists = (world.lists || []).filter((list) => (campaign.sourceListIds || []).includes(list.id))
  const mode = campaign.recipientMode || 'mixed'
  const raw = []
  for (const list of lists) {
    const members = listMembership(list, world)
    for (const contact of members.contacts) raw.push({ type: 'contact', id: contact.id, listId: list.id })
    for (const home of members.households) raw.push({ type: 'household', id: home.id, listId: list.id })
  }
  for (const row of campaign.includes || []) raw.push({ type: row.type, id: row.id, listId: '' })
  const excluded = new Set((campaign.excludes || []).map((row) => `${row.type}:${row.id}`))
  const expanded = []
  for (const row of raw) {
    if (excluded.has(`${row.type}:${row.id}`)) continue
    if (mode === 'individual' && row.type === 'household') {
      const home = households.get(row.id)
      for (const member of currentMembers(home)) {
        if (excluded.has(`contact:${member.contactId}`)) continue
        expanded.push({ type: 'contact', id: member.contactId, listId: row.listId, viaHousehold: row.id })
      }
      continue
    }
    if (mode === 'household' && row.type === 'contact') {
      const homes = [...households.values()].filter((home) => currentMembers(home).some((member) => member.contactId === row.id))
      if (homes.length === 1) expanded.push({ type: 'household', id: homes[0].id, listId: row.listId, viaContact: row.id })
      else expanded.push({ type: 'contact', id: row.id, listId: row.listId })
      continue
    }
    expanded.push(row)
  }
  const groups = new Map()
  for (const row of expanded) {
    const key = `${row.type}:${row.id}`
    const group = groups.get(key) || { type: row.type, id: row.id, listIds: [], via: [] }
    if (row.listId && !group.listIds.includes(row.listId)) group.listIds.push(row.listId)
    if (row.viaHousehold) group.via.push(row.viaHousehold)
    if (row.viaContact) group.via.push(row.viaContact)
    groups.set(key, group)
  }
  const drafts = []
  for (const group of groups.values()) {
    drafts.push(draftRecipient(group, campaign, contacts, households, world))
  }
  const duplicates = findDuplicates(drafts, campaign)
  for (const duplicate of duplicates) {
    duplicate.labels = duplicate.keys.map((key) => drafts.find((draft) => draft.key === key)?.salutation || key)
  }
  const separate = new Set(campaign.separateKeys || [])
  const confirmed = new Set(campaign.confirmedKeys || [])
  const combined = []
  const consumed = new Set()
  for (const duplicate of duplicates) {
    const auto = duplicate.reason === 'Same person' || duplicate.reason === 'Same household'
    if (separate.has(duplicate.id)) duplicate.resolution = 'separate'
    else if (auto || confirmed.has(duplicate.id)) duplicate.resolution = 'combine'
    else duplicate.resolution = 'pending'
    if (duplicate.resolution !== 'combine') continue
    const rows = duplicate.keys.map((key) => drafts.find((draft) => draft.key === key)).filter(Boolean)
    if (rows.length < 2) continue
    rows.sort((left, right) => (left.recipientType === 'household' ? 0 : 1) - (right.recipientType === 'household' ? 0 : 1))
    const keep = rows[0]
    for (const row of rows.slice(1)) {
      consumed.add(row.key)
      keep.sourceListIds = [...new Set([...keep.sourceListIds, ...row.sourceListIds])]
      keep.memberNames = [...new Set([...(keep.memberNames || []), ...(row.memberNames || [])])]
      keep.memberIds = [...new Set([...(keep.memberIds || []), ...(row.memberIds || [])])]
      keep.combined = [...new Set([...(keep.combined || []), row.displayName])]
    }
  }
  for (const draft of drafts) if (!consumed.has(draft.key)) combined.push(draft)
  const suppressed = suppressionSet(world.suppressions)
  let missing = 0
  for (const draft of combined) {
    if (draft.email) draft.suppressed = suppressed.has(draft.email.toLowerCase())
    const needsAddress = campaign.deliveryMethod !== 'digital' && !draft.address
    const needsEmail = campaign.deliveryMethod !== 'physical' && !draft.email
    draft.missing = []
    if (needsAddress) draft.missing.push('address')
    if (needsEmail && !draft.suppressed) draft.missing.push('email')
    if (draft.missing.length) missing += 1
  }
  combined.sort((a, b) => a.salutation.localeCompare(b.salutation))
  return { recipients: combined, duplicates, missing }
}

function draftRecipient(group, campaign, contacts, households, world) {
  const style = campaign.salutationStyle || 'preferred'
  if (group.type === 'household') {
    const home = households.get(group.id)
    const members = currentMembers(home).slice().sort((a, b) => a.displayOrder - b.displayOrder)
    const people = members.map((member) => contacts.get(member.contactId)).filter(Boolean)
    const formatted = formatSalutation(style === 'formal' ? 'formal' : style, people, home)
    const address = chosenAddress(home, campaign)
    const email = campaign.emailChoices?.[group.id] || people.map(primaryEmail).find(Boolean) || ''
    return {
      key: `household:${group.id}`,
      recipientType: 'household',
      recipientId: group.id,
      displayName: home?.name || formatted.salutation,
      salutation: formatted.salutation,
      memberNames: formatted.members,
      memberIds: members.map((member) => member.contactId),
      email,
      address: address ? clone(address) : null,
      deliveryMethod: campaign.deliveryMethod || 'physical',
      sourceListIds: group.listIds,
      missing: [],
      suppressed: false,
    }
  }
  const contact = contacts.get(group.id) || { id: group.id, displayName: 'Unknown contact' }
  const formatted = formatSalutation('names', [contact], null)
  const homes = [...households.values()].filter((home) => currentMembers(home).some((member) => member.contactId === group.id))
  const address = contactAddress(contact, homes, campaign)
  const email = campaign.emailChoices?.[group.id] || primaryEmail(contact)
  return {
    key: `contact:${group.id}`,
    recipientType: 'contact',
    recipientId: group.id,
    displayName: personName(contact).full,
    salutation: formatted.salutation,
    memberNames: formatted.members,
    memberIds: [group.id],
    email,
    address: address ? clone(address) : null,
    deliveryMethod: campaign.deliveryMethod || 'physical',
    sourceListIds: group.listIds,
    missing: [],
    suppressed: false,
  }
}

function chosenAddress(household, campaign) {
  const picked = campaign.addressChoices?.[household?.id]
  const current = currentAddresses(household)
  return current.find((address) => address.id === picked) || primaryAddress(household)
}

function contactAddress(contact, homes, campaign) {
  for (const home of homes) {
    const address = chosenAddress(home, campaign)
    if (address) return address
  }
  const own = residentialAddresses(contact).find((address) => addressKey(address))
  return own ? normalizeStoredAddress(own, { sourceContactId: contact.id }) : null
}

function findDuplicates(drafts, campaign) {
  const duplicates = []
  const byPerson = new Map()
  for (const draft of drafts) {
    for (const id of draft.memberIds || []) {
      const list = byPerson.get(id) || []
      list.push(draft.key)
      byPerson.set(id, list)
    }
  }
  for (const [id, keys] of byPerson) {
    const unique = [...new Set(keys)]
    if (unique.length < 2) continue
    duplicates.push(duplicateRow('Same person', unique, 'combine', id))
  }
  if ((campaign.deliveryMethod || 'physical') !== 'physical') {
    const byEmail = new Map()
    for (const draft of drafts) {
      const email = String(draft.email || '').trim().toLowerCase()
      if (!email) continue
      const list = byEmail.get(email) || []
      list.push(draft.key)
      byEmail.set(email, list)
    }
    for (const [email, keys] of byEmail) {
      const unique = [...new Set(keys)]
      if (unique.length < 2) continue
      duplicates.push(duplicateRow('Same email', unique, 'combine', email))
    }
  }
  if ((campaign.deliveryMethod || 'physical') !== 'digital') {
    const byAddress = new Map()
    for (const draft of drafts) {
      const key = addressKey(draft.address)
      if (!key) continue
      const list = byAddress.get(key) || []
      list.push(draft.key)
      byAddress.set(key, list)
    }
    for (const [key, keys] of byAddress) {
      const unique = [...new Set(keys)]
      if (unique.length < 2) continue
      duplicates.push(duplicateRow('Same address', unique, 'separate', key))
    }
  }
  return duplicates
}

function duplicateRow(reason, keys, defaultResolution, seed) {
  return {
    id: hashId('d', [reason, ...keys].sort()),
    reason,
    keys,
    defaultResolution,
    resolution: defaultResolution,
    seed,
  }
}

function buildSnapshots(campaignId, prepared, at = nowIso()) {
  return prepared.recipients
    .filter((row) => !row.suppressed)
    .map((row) => ({
      id: createId(),
      campaignId,
      recipientType: row.recipientType,
      recipientId: row.recipientId,
      recipientKey: row.key,
      displayName: row.displayName,
      salutation: row.salutation,
      memberNames: clone(row.memberNames || []),
      memberIds: clone(row.memberIds || []),
      email: row.email || '',
      address: row.address ? clone(row.address) : null,
      deliveryMethod: row.deliveryMethod,
      deliveryStatus: 'approved',
      sourceListIds: clone(row.sourceListIds || []),
      includedAt: at,
      exportedAt: '',
      sentAt: '',
      deliveredAt: '',
      notes: '',
      excluded: Boolean(row.missing?.length),
      missing: clone(row.missing || []),
      locked: false,
      corrections: [],
    }))
}

function syncSnapshots(existing, built) {
  const kept = []
  const used = new Set()
  for (const previous of existing || []) {
    if (previous.locked) {
      kept.push(previous)
      used.add(previous.recipientKey)
      continue
    }
    const next = built.find((row) => row.recipientKey === previous.recipientKey)
    if (!next) continue
    used.add(next.recipientKey)
    kept.push({
      ...next,
      id: previous.id,
      deliveryStatus: previous.deliveryStatus === 'pending' ? 'approved' : previous.deliveryStatus,
      exportedAt: previous.exportedAt,
      sentAt: previous.sentAt,
      deliveredAt: previous.deliveredAt,
      notes: previous.notes,
      corrections: previous.corrections || [],
    })
  }
  for (const row of built) if (!used.has(row.recipientKey)) kept.push(row)
  return kept
}

function applySnapshotEdit(record, patch, context) {
  if (record.locked && !String(context?.reason || '').trim()) {
    throw new Error('A completed campaign needs a correction reason')
  }
  const next = { ...record, ...clone(patch) }
  if (patch.address) next.address = clone(patch.address)
  if (record.locked) {
    next.locked = true
    next.corrections = [...(record.corrections || []), {
      at: context.at || nowIso(),
      actor: context.actor || 'Someone',
      reason: context.reason,
      fields: Object.keys(patch),
    }]
  }
  return next
}

function mergeHouseholds(target, source) {
  const next = clone(target)
  const gone = clone(source)
  const at = nowIso()
  const present = new Set(currentMembers(next).map((member) => member.contactId))
  for (const member of currentMembers(gone)) {
    if (present.has(member.contactId)) continue
    next.members.push({ ...member, primary: false, displayOrder: next.members.length, validFrom: at })
  }
  const keys = new Set((next.addresses || []).map(addressKey))
  for (const address of currentAddresses(gone)) {
    if (keys.has(addressKey(address))) continue
    next.addresses.push(clone(address))
  }
  if (!next.primaryAddressId) next.primaryAddressId = primaryAddress(next)?.id || ''
  next.updatedAt = at
  gone.archived = true
  gone.mergedInto = next.id
  gone.updatedAt = at
  return { target: next, source: gone }
}

function splitHousehold(household, contactIds, name) {
  const stay = clone(household)
  const moving = new Set(contactIds)
  const at = nowIso()
  const movedMembers = currentMembers(stay).filter((member) => moving.has(member.contactId))
  stay.members = (stay.members || []).map((member) => moving.has(member.contactId) && !member.validUntil ? { ...member, validUntil: at } : member)
  if (!currentMembers(stay).some((member) => member.primary)) {
    const first = currentMembers(stay)[0]
    if (first) stay.members = stay.members.map((member) => member.contactId === first.contactId && !member.validUntil ? { ...member, primary: true } : member)
  }
  const address = primaryAddress(stay)
  const created = {
    id: createId(),
    name: name || 'New household',
    salutation: name || '',
    notes: '',
    primaryAddressId: '',
    addresses: [],
    members: movedMembers.map((member, index) => ({
      ...member,
      primary: index === 0,
      displayOrder: index,
      validFrom: at,
      validUntil: '',
    })),
    archived: false,
    createdAt: at,
    updatedAt: at,
  }
  if (address) {
    const copy = normalizeStoredAddress(address)
    created.addresses = [copy]
    created.primaryAddressId = copy.id
  }
  stay.updatedAt = at
  return { stay, created }
}

function movedPeople(contacts, households) {
  const rows = []
  for (const household of households || []) {
    if (household.archived) continue
    for (const address of currentAddresses(household)) {
      if (!address.sourceContactId) continue
      const contact = (contacts || []).find((row) => row.id === address.sourceContactId)
      if (!contact) continue
      const live = residentialAddresses(contact).map(addressKey).filter(Boolean)
      const saved = addressKey(address)
      if (saved && live.length && !live.includes(saved)) {
        rows.push({
          contactId: contact.id,
          name: personName(contact).full,
          householdId: household.id,
          household: household.name,
          previous: address.formatted || formatAddress(address).join(', '),
          current: formatAddress(residentialAddresses(contact)[0]).join(', '),
        })
      }
    }
  }
  return rows
}

function missingAddressContacts(contacts) {
  return (contacts || []).filter((contact) => !residentialAddresses(contact).some((address) => addressKey(address))).map((contact) => ({
    id: contact.id,
    name: personName(contact).full,
  }))
}

function quietHouseholds(households, recipients, campaigns, years = 2) {
  const cutoff = Date.now() - years * 365 * 24 * 60 * 60 * 1000
  const rows = []
  for (const household of households || []) {
    if (household.archived) continue
    let latest = 0
    for (const recipient of recipients || []) {
      if (recipient.excluded || recipient.recipientId !== household.id) continue
      const campaign = (campaigns || []).find((row) => row.id === recipient.campaignId)
      if (!campaign || campaign.status === 'draft') continue
      const when = Date.parse(recipient.sentAt || recipient.exportedAt || recipient.includedAt || '')
      if (!Number.isNaN(when)) latest = Math.max(latest, when)
    }
    if (!latest || latest < cutoff) {
      rows.push({ id: household.id, name: household.name, last: latest ? new Date(latest).toISOString() : '' })
    }
  }
  return rows
}

function interpret(text, world) {
  const query = String(text || '').trim()
  if (!query) return null
  const lower = query.toLowerCase()
  const tagged = query.match(/tagged\s+(.+?)\s+to\s+(.+)/i)
  if (tagged) {
    return {
      type: 'mutate',
      action: 'add-tag',
      title: `Add people tagged ${tagged[1].trim()}`,
      detail: `Add matching people to ${tagged[2].trim()}. Nothing is added until you approve.`,
      payload: { tag: tagged[1].trim(), target: tagged[2].trim() },
    }
  }
  if (/without (a )?mailing address|no mailing address|missing address/.test(lower)) {
    const rows = missingAddressContacts(world.contacts)
    return { type: 'query', title: 'Contacts without a mailing address', rows: rows.map((row) => ({ label: row.name, meta: 'No residential address' })) }
  }
  if (/duplicate household/.test(lower)) {
    const suggestions = (world.suggestions || []).filter((row) => row.status === 'pending')
    return {
      type: 'query',
      title: 'Possible duplicate or matching households',
      rows: suggestions.map((row) => ({ label: row.reasons.join(' · ') || 'Possible match', meta: `${row.confidence}% · ${row.kind}` })),
    }
  }
  const compare = query.match(/compare\s+(.+?)\s+with\s+(.+)/i)
  if (compare) return compareNamed(compare[1], compare[2], world)

  }
  if (/newly added|new contacts/.test(lower)) {
    const cutoff = Date.now() - 90 * 24 * 60 * 60 * 1000
    const listed = new Set()
    for (const list of world.lists || []) {
      const members = listMembership(list, world)
      members.contacts.forEach((contact) => listed.add(contact.id))

    }

  }
  const received = query.match(/(?:received|got)\s+(?:a\s+)?(.+?)\s+last year/i)

    for (const campaign of world.campaigns || []) {

function compareNamed(leftName, rightName, world) {
  const left = findNamed(leftName, world)
  const right = findNamed(rightName, world)
  if (!left || !right) {
    return { type: 'query', title: 'Could not find both lists or campaigns', rows: [{ label: left ? left.name : leftName.trim(), meta: left ? 'Found' : 'Not found' }, { label: right ? right.name : rightName.trim(), meta: right ? 'Found' : 'Not found' }] }
  }
  const a = nameSet(left, world)
  const b = nameSet(right, world)
  const rows = []
  for (const name of a) if (!b.has(name)) rows.push({ label: name, meta: `Only in ${left.name}` })
  for (const name of b) if (!a.has(name)) rows.push({ label: name, meta: `Only in ${right.name}` })
  if (!rows.length) rows.push({ label: 'The same people', meta: left.name })
  return { type: 'query', title: `${left.name} compared with ${right.name}`, rows }
}

function findNamed(name, world) {
  const needle = name.trim().toLowerCase()
  return [...(world.campaigns || []), ...(world.lists || [])].find((row) => row.name.toLowerCase() === needle)

  members.households.forEach((home) => names.add(home.salutation || home.name))

}

  try {
    const identity = M().memberIdentity(await host.get('member'), state.me)
    if (identity.changed) await host.set('member', identity.token)
    state.member = { id: identity.id, name: identity.name }
  } catch (error) { /* personal storage is optional; shared lists still open */ }
  state.settings = await host.settings()
  state.contactId = host.contactId || null
  state.prefs = defaultPrefs()
  try {
    const saved = await host.records.get('preferences', 'workspace')
    state.prefs = { ...defaultPrefs(), ...saved.body, blockedPairs: saved.body.blockedPairs || [] }
  } catch (error) { /* first visit */ }
  if (state.settings.paper === 'a4' || state.settings.paper === 'letter') state.prefs.paper = state.settings.paper
  const collections = ['households', 'lists', 'campaigns', 'recipients', 'deliveries', 'exports', 'suggestions', 'templates', 'suppressions', 'audit', 'contact-notes']
  const loaded = await Promise.all(collections.map((name) => loadAll(name)))
  ;[state.households, state.lists, state.campaigns, state.recipients, state.deliveries, state.exports, state.suggestions, state.templates, state.suppressions, state.audit, state.notes] = loaded
  state.ready = true
  if (state.contactId) state.screen = 'contact'
  render()
  await loadContacts()
  await scanHouseholds()
  setStatus('')
  render()
}

async function scanHouseholds() {
  const plan = M().planHouseholds(state.contacts, state.households, state.suggestions, autoOn(), state.prefs.blockedPairs || [])
  for (const household of plan.create) {
    household.createdAt = M().nowIso()
    household.updatedAt = household.createdAt
    const saved = await saveRecord('households', household)
    upsert(state.households, saved)
    await writeAudit('household.group', 'household', saved.id, `Grouped ${saved.name} because ${household.match.reasons.join(', ')} (${household.match.confidence}%).`)
  }
  for (const suggestion of plan.suggest) {
    if (state.suggestions.some((row) => row.id === suggestion.id)) continue
    const saved = await saveRecord('suggestions', suggestion)
    upsert(state.suggestions, saved)
  }
}

function rememberPair(left, right) {
  const key = M().pairKey(left, right)
  state.prefs.blockedPairs = state.prefs.blockedPairs || []
  if (!state.prefs.blockedPairs.includes(key)) state.prefs.blockedPairs.push(key)
}

function render() {
  const active = document.activeElement
  const key = active && active.id
  const pos = active && typeof active.selectionStart === 'number' ? active.selectionStart : null
  const main = document.querySelector('.main')
  const top = main ? main.scrollTop : 0
  app.innerHTML = shell()
  const nextMain = document.querySelector('.main')
  if (nextMain) nextMain.scrollTop = top
  if (key) {
    const node = document.getElementById(key)
    if (node) {
      node.focus()
      if (pos != null && node.setSelectionRange) node.setSelectionRange(pos, pos)
    }
  }
}

function shell() {
  if (!state.ready) return `<p class="muted">${esc(state.error || 'Loading mailing lists…')}</p>`
  const screens = [['overview', 'Overview'], ['households', 'Households'], ['lists', 'Lists'], ['campaigns', 'Campaigns'], ['history', 'History'], ['exports', 'Exports'], ['settings', 'Settings']]
  if (state.contactId) screens.unshift(['contact', 'This person'])
  return `<div class="shell">
    <div class="top"><h1>Mailing Lists</h1><p class="lede">${esc(state.me ? `Signed in as ${state.me}. ` : '')}Shared lists are the same for everyone in this workspace. People in Rolodex are left unchanged.</p></div>
    <nav class="nav">${screens.map(([id, label]) => `<button type="button" data-action="nav" data-id="${id}" ${state.screen === id ? 'aria-current="page"' : ''}>${label}</button>`).join('')}</nav>
    <main class="main">
      <p id="status" class="muted">${esc(state.notice)}</p>
      ${state.error ? `<p class="banner bad">${esc(state.error)}</p>` : ''}
      ${state.confirm ? `<div class="banner warn"><p>${esc(state.confirm)}</p><div class="split"><button type="button" class="primary" data-action="confirm-yes">Continue</button><button type="button" class="ghost" data-action="confirm-no">Cancel</button></div></div>` : ''}

}

function view() {
  if (state.screen === 'contact') return contactView()
  if (state.screen === 'household') return householdView()
  if (state.screen === 'households') return householdsView()
  if (state.screen === 'list') return listView()
  if (state.screen === 'lists') return listsView()
  if (state.screen === 'campaign') return campaignView()
  if (state.screen === 'campaigns') return campaignsView()
  if (state.screen === 'history') return historyView()

  return overviewView()
}

function overviewView() {
  const homes = activeHouseholds()
  const people = new Set()
  homes.forEach((home) => M().currentMembers(home).forEach((member) => people.add(member.contactId)))
  const campaigns = visibleCampaigns().filter((row) => row.status !== 'archived')
  const active = campaigns.filter((row) => row.status === 'ready' || row.status === 'active')
  const upcoming = campaigns.filter((row) => row.scheduledAt && row.status !== 'completed')
  const missing = M().missingAddressContacts(state.contacts)
  const review = state.suggestions.filter((row) => row.status === 'pending' && row.level === 'review')
  const recent = campaigns.filter((row) => row.status === 'completed').slice(0, 5)
  return `<section class="grid">
      ${stat(homes.length, 'Households')}${stat(people.size, 'People in households')}${stat(visibleLists().length, 'Lists')}${stat(active.length, 'Active campaigns')}
    </section>
    ${review.length ? `<section class="card"><h2>Review these household matches</h2>${review.map(suggestionCard).join('')}</section>` : ''}
    <section class="card"><h2>Needs attention</h2>
      <div class="row"><div><b>${missing.length}</b> contacts have no mailing address</div><button type="button" class="ghost" data-action="nav" data-id="households">Review</button></div>
      <div class="row"><div><b>${upcoming.length}</b> campaigns have a schedule</div><button type="button" class="ghost" data-action="nav" data-id="campaigns">Campaigns</button></div>

    </section>

}

function recipientsTab(campaign) {

  const showingStored = stored.length && campaign.status !== 'draft'
  const rows = showingStored ? stored : prepared.recipients
  const unresolved = prepared.duplicates.filter((row) => M().duplicateGroupNeedsChoice(row) && row.resolution === 'pending')
  return `<section class="card stack">
      <p>${locked ? 'This campaign is complete. The saved recipient list does not follow later address changes.' : showingStored ? 'This is the approved snapshot. Rebuild it if the lists changed.' : 'This is a preview. Approving saves a copy of each recipient.'}</p>
      ${prepared.duplicates.map((row) => `<div class="banner ${row.resolution === 'pending' ? 'warn' : ''}"><b>${esc(row.reason)}</b><div>${(row.labels || []).map(esc).join(' · ')}</div><div class="muted">${row.resolution === 'combine' ? 'One delivery' : row.resolution === 'separate' ? 'Separate deliveries' : 'Choose one'}</div>${row.resolution === 'pending' ? `<div class="split"><button type="button" class="primary" data-action="resolve-duplicate" data-id="${esc(row.id)}" data-choice="combine">Combine</button><button type="button" class="ghost" data-action="resolve-duplicate" data-id="${esc(row.id)}" data-choice="separate">Keep separate</button></div>` : ''}</div>`).join('')}

function ask(text, run) { confirmRun = run; state.confirm = text; render() }
function openRecord(screen, collection, id) {
  const record = state[collection].find((row) => row.id === id)
  if (!record) return
  if (collection === 'lists' && !M().canSeeShared(record, state.member?.id)) return
  if (collection === 'campaigns' && !M().canSeeCampaign(record, state.lists, state.member?.id)) return
  state.edit = M().clone(record)
  state.screen = screen
  state.selectedId = id
  state.query = ''
  state.page = 0
  render()
}
async function persistEdit(collection, list) {
  if (state.edit?.customType) state.edit.campaignType = slug(state.edit.customType)
  if (collection === 'lists' || collection === 'campaigns') {
    const sharing = collection === 'campaigns' ? M().campaignSharing(state.edit, state.lists) : state.edit.sharing
    state.edit = M().withAccess(state.edit, state.member, sharing)
  }
  const saved = await saveRecord(collection, state.edit)
  upsert(list, saved)
  state.edit = M().clone(saved)
  state.notice = 'Saved.'
  render()
}
async function archiveHousehold() {
  if (state.edit.match) {
    const members = M().currentMembers(state.edit).map((member) => member.contactId)
    for (let left = 0; left < members.length; left += 1) {
      for (let right = left + 1; right < members.length; right += 1) rememberPair(members[left], members[right])
    }
    await savePrefs()
  }
  await archiveRecord('households', state.households, 'household.archive')
}
async function archiveRecord(collection, list, action) {
  state.edit.archived = true
  state.edit.status = state.edit.status ? 'archived' : state.edit.status
  const saved = await saveRecord(collection, state.edit)
  upsert(list, saved)
  await writeAudit(action, collection, saved.id, `Archived ${saved.name || saved.id}.`)
  state.edit = null
  state.screen = collection === 'households' ? 'households' : collection === 'lists' ? 'lists' : 'campaigns'
  render()
}
async function createHousehold(name, contactIds) {
  const people = contactIds.map(contact).filter(Boolean)
  const address = people.length ? M().residentialAddresses(people[0])[0] : null
  const stored = address ? M().normalizeStoredAddress(address, { sourceContactId: people[0].id }) : null
  const household = {
    id: M().createId(),
    name: name || (people.length ? M().householdTitle(people) : 'New household'),
    salutation: name || '',
    notes: '',
    primaryAddressId: stored?.id || '',
    addresses: stored ? [stored] : [],
    members: people.map((person, index) => ({ contactId: person.id, relationshipType: 'member', displayOrder: index, primary: index === 0, validFrom: M().nowIso(), validUntil: '' })),
    archived: false,
    createdAt: M().nowIso(),
  }
  const saved = await saveRecord('households', household)
  upsert(state.households, saved)
  await writeAudit('household.create', 'household', saved.id, `Created ${saved.name}.`)
  openRecord('household', 'households', saved.id)
}
async function addMember(contactId, force) {
  const others = activeHouseholds().filter((home) => home.id !== state.edit.id && M().currentMembers(home).some((member) => member.contactId === contactId))
  if (others.length && !force) {
    ask(`${nameOf(contactId)} already belongs to ${others[0].name}. Add them to this household as well?`, () => addMember(contactId, true))
    return false
  }
  if (M().currentMembers(state.edit).some((member) => member.contactId === contactId)) { render(); return true }
  state.edit.members.push({ contactId, relationshipType: 'member', displayOrder: state.edit.members.length, primary: state.edit.members.length === 0, validFrom: M().nowIso(), validUntil: '' })
  await persistEdit('households', state.households)
  await writeAudit('household.member', 'household', state.edit.id, `Added ${nameOf(contactId)}.`)
  return true
}
async function endMember(contactId) {
  state.edit.members = state.edit.members.map((member) => member.contactId === contactId && !member.validUntil ? { ...member, validUntil: M().nowIso(), primary: false } : member)
  if (!M().currentMembers(state.edit).some((member) => member.primary)) {
    const first = M().currentMembers(state.edit)[0]
    if (first) state.edit.members = state.edit.members.map((member) => member.contactId === first.contactId && !member.validUntil ? { ...member, primary: true } : member)
  }
  await persistEdit('households', state.households)
}
async function makePrimary(contactId) {
  state.edit.members = state.edit.members.map((member) => !member.validUntil ? { ...member, primary: member.contactId === contactId } : member)
  await persistEdit('households', state.households)
}
async function saveAddress() {
  const draft = state.addressDraft
  if (state.replacingId) state.edit = M().replaceAddress(state.edit, state.replacingId, draft)
  else {
    const stored = M().normalizeStoredAddress(draft)
    state.edit.addresses = [...(state.edit.addresses || []), stored]
    if (!state.edit.primaryAddressId) state.edit.primaryAddressId = stored.id
  }
  state.addressDraft = blankAddress()
  state.replacingId = ''
  await persistEdit('households', state.households)
  await writeAudit('address.update', 'household', state.edit.id, 'Updated a household address and kept the previous one.')
}
async function undoGroup() {
  const members = M().currentMembers(state.edit).map((member) => member.contactId)
  for (let left = 0; left < members.length; left += 1) for (let right = left + 1; right < members.length; right += 1) rememberPair(members[left], members[right])
  await savePrefs()
  state.edit.archived = true
  await persistEdit('households', state.households)
  await writeAudit('household.undo', 'household', state.edit.id, 'Reversed an automatic grouping.')
  state.screen = 'households'
  state.edit = null
  render()
}
async function mergeCurrent() {
  const source = state.households.find((home) => home.id === state.forms.mergeId)
  if (!source) return
  const merged = M().mergeHouseholds(state.edit, source)
  state.edit = merged.target
  await persistEdit('households', state.households)
  const archived = await saveRecord('households', merged.source)
  upsert(state.households, archived)
  await writeAudit('household.merge', 'household', state.edit.id, `Merged ${source.name} into ${state.edit.name}.`)
}
async function splitCurrent() {
  const ids = M().currentMembers(state.edit).map((member) => member.contactId).filter((id) => state.forms[`split-${id}`])
  if (!ids.length) throw new Error('Choose the people to move.')
  const result = M().splitHousehold(state.edit, ids, state.forms.splitName || 'New household')
  state.edit = result.stay
  await persistEdit('households', state.households)
  const created = await saveRecord('households', result.created)
  upsert(state.households, created)
  await writeAudit('household.split', 'household', created.id, `Split ${ids.length} people into ${created.name}.`)
  openRecord('household', 'households', created.id)
}
async function acceptSuggestion(id) {
  const suggestion = state.suggestions.find((row) => row.id === id)
  if (!suggestion) return
  if (suggestion.kind === 'create') {
    await createHousehold('', suggestion.contactIds)
    const created = state.households.find((home) => home.id === state.selectedId)
    if (created) {
      created.match = { confidence: suggestion.confidence, reasons: suggestion.reasons, at: M().nowIso() }
      const saved = await saveRecord('households', created)
      upsert(state.households, saved)
    }
  } else if (suggestion.kind === 'add') {
    openRecord('household', 'households', suggestion.householdId)
    const added = await addMember(suggestion.contactIds[0], false)
    if (!added) return
  } else if (suggestion.kind === 'merge') {
    const target = state.households.find((home) => home.id === suggestion.householdId)
    const source = state.households.find((home) => home.id === suggestion.otherHouseholdId)
    if (target && source) {
      const merged = M().mergeHouseholds(target, source)
      await saveRecord('households', merged.target)
      await saveRecord('households', merged.source)
      upsert(state.households, merged.target)
      upsert(state.households, merged.source)
      await writeAudit('household.merge', 'household', target.id, `Merged ${source.name} into ${target.name}.`)
    }
  }
  suggestion.status = 'accepted'
  await saveRecord('suggestions', suggestion)
  upsert(state.suggestions, suggestion)
  render()
}
async function dismissSuggestion(id) {
  const suggestion = state.suggestions.find((row) => row.id === id)
  if (!suggestion) return
  suggestion.status = 'dismissed'
  if (suggestion.contactIds.length === 2) rememberPair(suggestion.contactIds[0], suggestion.contactIds[1])
  await savePrefs()
  await saveRecord('suggestions', suggestion)
  upsert(state.suggestions, suggestion)
  await writeAudit('household.dismiss', 'suggestion', id, suggestion.reasons.join(', '))
  render()
}
async function setSharing(sharing) {
  if (!state.edit) return
  const noun = state.screen === 'campaign' ? 'campaign' : 'list'
  if (sharing === 'private' && state.edit.ownerId && state.edit.ownerId !== state.member?.id) {
    throw new Error('The person who created this can stop sharing it.')
  }
  if (noun === 'campaign' && sharing === 'workspace' && M().campaignSharing({ ...state.edit, sharing: 'workspace' }, state.lists) === 'private') {
    throw new Error('Share each private list on this campaign before sharing the campaign.')
  }
  state.edit.sharing = sharing === 'private' ? 'private' : 'workspace'
  const collection = noun === 'campaign' ? 'campaigns' : 'lists'
  await persistEdit(collection, state[collection])
  await writeAudit(`${noun}.share`, noun, state.edit.id, sharing === 'private' ? `Kept ${state.edit.name} private.` : `Shared ${state.edit.name} with this workspace.`)
  state.notice = sharing === 'private' ? 'Only you can see this now.' : 'Shared with this workspace. Other members can edit it.'
  render()
}

function slug(value) {
  const text = String(value || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')
  return text || 'general'
}

async function approveCampaign() {
  const campaign = state.edit
  if (campaign.status === 'completed' || campaign.status === 'archived') throw new Error('A completed campaign stays as it was.')
  await saveCampaignEdit()
  const prepared = M().prepareCampaign(state.edit, world())
  const unresolved = prepared.duplicates.filter((row) => M().duplicateGroupNeedsChoice(row) && row.resolution === 'pending')
  if (unresolved.length) throw new Error('Choose combine or keep separate for each shared address or email.')
  const built = M().buildSnapshots(campaign.id, prepared)
  const existing = state.recipients.filter((row) => row.campaignId === campaign.id)
  const synced = M().syncSnapshots(existing, built)
  for (const previous of existing) {
    if (!previous.locked && !synced.some((row) => row.id === previous.id)) {
      await api().records.remove('recipients', previous.id)
      state.recipients = state.recipients.filter((row) => row.id !== previous.id)
    }
  }
  for (const row of synced) {
    if (row.locked) continue
    const saved = await saveRecord('recipients', row)
    upsert(state.recipients, saved)
  }
  state.edit.status = 'ready'
  state.edit.approvedAt = state.edit.approvedAt || M().nowIso()
  await persistEdit('campaigns', state.campaigns)
  await writeAudit('campaign.approve', 'campaign', campaign.id, `Approved ${synced.filter((row) => !row.excluded).length} recipients for ${campaign.name}.`)
}
async function completeCampaign() {
  if (state.edit.status === 'completed') { state.notice = 'This campaign is already complete.'; render(); return }
  if (state.edit.status !== 'ready' && state.edit.status !== 'active') throw new Error('Approve the recipients first.')
  for (const row of state.recipients.filter((item) => item.campaignId === state.edit.id)) {
    if (row.locked) continue
    row.locked = true
    const saved = await saveRecord('recipients', row)
    upsert(state.recipients, saved)
  }
  state.edit.status = 'completed'
  state.edit.completedAt = M().nowIso()
  await persistEdit('campaigns', state.campaigns)
  await writeAudit('campaign.complete', 'campaign', state.edit.id, `Completed ${state.edit.name}.`)
}
async function correctRecipient() {
  const row = state.recipients.find((item) => item.id === state.forms.correctId) || state.recipients.find((item) => item.campaignId === state.edit.id && !item.excluded)
  if (!row) throw new Error('Choose a recipient.')
  const patch = {}
  if (state.forms.correctLine) patch.address = { ...(row.address || {}), line1: state.forms.correctLine, formatted: '' }
  const next = M().applySnapshotEdit(row, patch, { reason: state.forms.correctReason, actor: state.me, at: M().nowIso() })
  if (next.address) next.address.formatted = M().formatAddress(next.address).join(', ')
  const saved = await saveRecord('recipients', next)
  upsert(state.recipients, saved)
  await writeAudit('recipient.correct', 'recipient', saved.id, state.forms.correctReason)
  state.notice = 'Correction saved.'
  render()
}
async function setStatusOn(id, status) {
  const row = state.recipients.find((item) => item.id === id)
  if (!row || row.deliveryStatus === status) return
  const at = M().nowIso()
  const delivery = { id: M().createId(), campaignId: row.campaignId, campaignRecipientId: row.id, channel: row.deliveryMethod === 'digital' ? 'email' : 'physical', deliveryStatus: status, provider: 'manual', providerReference: '', attemptedAt: at, completedAt: at, errorMessage: '', metadata: {} }
  const savedDelivery = await saveRecord('deliveries', delivery)
  state.deliveries.push(savedDelivery)
  row.deliveryStatus = status
  if (status === 'exported') row.exportedAt = at
  if (status === 'sent' || status === 'queued') row.sentAt = at
  if (status === 'delivered' || status === 'received') row.deliveredAt = at
  const saved = await saveRecord('recipients', row)
  upsert(state.recipients, saved)
  const campaign = state.campaigns.find((item) => item.id === row.campaignId)
  if (campaign && campaign.status === 'ready') {
    campaign.status = 'active'
    const savedCampaign = await saveRecord('campaigns', campaign)
    upsert(state.campaigns, savedCampaign)
    if (state.edit?.id === campaign.id) state.edit.status = 'active'
  }
  render()
}
async function exportCampaign(kind) {
  const campaign = state.edit
  if (!['ready', 'active', 'completed'].includes(campaign.status)) throw new Error('Approve the recipient list before exporting.')
  const rows = state.recipients.filter((row) => row.campaignId === campaign.id && !row.excluded)
  if (!rows.length) throw new Error('There are no included recipients to export.')
  const printable = rows.map((row) => (row.deliveryStatus === 'pending' || row.deliveryStatus === 'approved' ? { ...row, deliveryStatus: 'exported' } : row))
  const base = M().safeFilename(campaign.name)
  let filename = `${base}.csv`
  let contentType = 'text/csv'
  let data = ''
  if (kind === 'csv') data = M().utf8Base64(M().recipientCsv(printable))
  if (kind === 'xlsx') {
    filename = `${base}.xlsx`
    contentType = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    data = M().bytesToBase64(M().recipientXlsx(printable))
  }
  if (kind === 'labels' || kind === 'envelopes') {
    const chosen = M().templateById(state.prefs.templateId, state.templates)
    const template = kind === 'envelopes'
      ? (chosen.kind === 'envelope' ? chosen : M().templateById('envelope-10', state.templates))
      : (chosen.kind === 'label' ? chosen : M().templateById('avery-5160', state.templates))
    filename = `${base}-${kind}.pdf`
    contentType = 'application/pdf'
    data = M().bytesToBase64(M().labelPdf(printable, template))
  }
  if (data.length > 5600000) throw new Error('That export is over 4 MB. Approve a smaller recipient list and try again.')
  const file = await api().files.put({ filename, contentType, data })
  const record = { id: M().createId(), campaignId: campaign.id, exportType: kind, fileFormat: contentType, templateId: state.prefs.templateId, generatedAt: M().nowIso(), generatedBy: state.me, recipientCount: rows.length, configuration: { templateId: state.prefs.templateId }, fileId: file.id, filename }
  const saved = await saveRecord('exports', record)
  state.exports.unshift(saved)
  for (const row of rows) {
    if (row.deliveryStatus === 'pending' || row.deliveryStatus === 'approved') await setStatusOn(row.id, 'exported')
  }
  await api().files.download(file.id, filename)
  await writeAudit('campaign.export', 'campaign', campaign.id, `Exported ${rows.length} recipients as ${filename}.`)
  state.notice = `Exported ${filename}.`
  render()
}

async function askQuestion() {
  const text = state.forms.question.trim()
  state.aiText = ''
  state.proposal = M().interpret(text, world())
  if (state.proposal) { render(); return }
  const summary = [
    `Households: ${activeHouseholds().map((home) => `${home.name} (${M().currentMembers(home).length})`).join(', ') || 'none'}`,
    `Lists: ${visibleLists().map((list) => `${list.name} (${list.listType})`).join(', ') || 'none'}`,
    `Campaigns: ${visibleCampaigns().map((row) => `${row.name} (${row.status})`).join(', ') || 'none'}`,
    'Do not invent addresses, emails, or household merges. Describe a suggestion only.',
    `Question: ${text}`,
  ].join('\n')
  const result = await api().suggest(summary.slice(0, 8000))
  state.aiText = result?.text || 'The assistant did not return a suggestion.'
  render()
}
async function applyProposal() {
  const proposal = state.proposal
  if (!proposal || proposal.type !== 'mutate' || proposal.action !== 'add-tag') return
  const people = M().contactsForTag(state.contacts, proposal.payload.tag)
  const target = proposal.payload.target
  const list = visibleLists().find((row) => row.name.toLowerCase() === target.toLowerCase())
  const campaign = visibleCampaigns().find((row) => row.name.toLowerCase() === target.toLowerCase() && row.status !== 'completed' && row.status !== 'archived')
  if (list?.listType === 'dynamic') throw new Error('That list is dynamic. Add a tag condition instead of copying people into it.')
  if (list) {
    list.members = list.members || []
    for (const person of people) {
      if (!list.members.some((member) => member.type === 'contact' && member.id === person.id)) list.members.push({ type: 'contact', id: person.id, status: 'included', addedAt: M().nowIso(), addedBy: state.me, notes: '' })
    }
    const saved = await saveRecord('lists', M().withAccess(list, state.member, list.sharing))
    upsert(state.lists, saved)
    await writeAudit('list.members', 'list', list.id, `Added ${people.length} people tagged ${proposal.payload.tag}.`)
  } else if (campaign) {
    campaign.includes = campaign.includes || []
    for (const person of people) {
      if (!campaign.includes.some((member) => member.id === person.id)) campaign.includes.push({ type: 'contact', id: person.id })
    }
    const saved = await saveRecord('campaigns', M().withAccess(campaign, state.member, M().campaignSharing(campaign, state.lists)))
    upsert(state.campaigns, saved)
    await writeAudit('campaign.include', 'campaign', campaign.id, `Added ${people.length} people tagged ${proposal.payload.tag}.`)
  } else {
    state.forms.listName = target
    state.forms.listType = 'static'
    await createList()
    for (const person of people) await addListMember('contact', person.id)
  }
  state.proposal = null
  state.notice = `Added ${people.length} people after your approval.`
  render()
}
async function addContactToList() {
  const list = visibleLists().find((row) => row.id === state.forms.listPick)
  if (!list || list.listType === 'dynamic') throw new Error('Choose a static list.')
  list.members = list.members || []
  if (!list.members.some((member) => member.type === 'contact' && member.id === state.contactId)) {
    list.members.push({ type: 'contact', id: state.contactId, status: 'included', addedAt: M().nowIso(), addedBy: state.me, notes: '' })
    const saved = await saveRecord('lists', M().withAccess(list, state.member, list.sharing))
    upsert(state.lists, saved)
    await writeAudit('list.members', 'list', list.id, `Added ${nameOf(state.contactId)} from the contact profile.`)
  }
  state.notice = 'Added to the list.'
  render()
}
async function saveContactNote() {

  const existing = state.notes.find((row) => row.id === id)
  const record = { id, contactId: state.contactId, salutation: state.forms.contactSalutation ?? existing?.salutation ?? '', notes: state.forms.contactNotes ?? existing?.notes ?? '', delivery: 'physical' }

}

function onClick(event) {
  const node = event.target.closest('[data-action]')
  if (!node || !app.contains(node)) return
  if (node.tagName === 'INPUT') return
  event.preventDefault()
  run(node.dataset.action, node.dataset.id || '', node)
}
function onField(event) {
  const node = event.target
  if (!node?.dataset) return
  if (node.dataset.action === 'toggle-source' && event.type === 'change') {
    run('toggle-source', node.dataset.id || '', node)
    return
  }
  if (node.dataset.bind) {
    const scope = node.dataset.scope || 'edit'
    if (state[scope]) setPath(state[scope], node.dataset.bind, node.type === 'checkbox' ? node.checked : node.value)
    if (node.dataset.bind === 'templateId' && event.type === 'change') render()
  }
  if (node.dataset.live && event.type === 'input') {
    state[node.dataset.live] = node.value
    render()
  }
}
function run(action, id, node) {
  const fn = actions[action]
  if (!fn) return
  state.error = ''
  Promise.resolve(fn(id, node)).catch((error) => { state.error = error.message || 'Something went wrong.'; render() })
}

app.addEventListener('click', onClick)
app.addEventListener('input', onField)
app.addEventListener('change', onField)
window.addEventListener('rolodex', () => { boot().catch((error) => { state.error = error.message || 'Mailing Lists could not open.'; render() }) })
setTimeout(() => { if (!state.ready && !window.rolodex) state.error = 'Open Mailing Lists from Rolodex.'; render() }, 2000)
